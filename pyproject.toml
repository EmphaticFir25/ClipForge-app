[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-app"
version = "0.1.0"
description = "Web app for turning uploaded livestream recordings into scored, captioned vertical clips"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "cryptography>=43"]

[project.optional-dependencies]
ml = ["mediapipe>=0.10", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["engine", "."]
include = ["clipforge*", "webapp*"]

[tool.pytest.ini_options]
pythonpath = ["engine", "."]
testpaths = ["tests"]
